
<!DOCTYPE html>
<html>
<head>
    <title>Saylani Login Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <p class="signup">Sign up</p>

    <div class="main">

        <!-- Login Form -->
        <div class="login">

            <h1><img src="https://www.saylaniwelfareuk.com/_next/image?url=%2Fsaylani_full_logo.png&w=640&q=75"></h1>

            <h2>Log into your Account</h2>

            <form>
                <div class="input-box">
                    <span>✉</span>
                    <input type="email"
                    placeholder="ABC@email.com">
                </div>

                <div class="input-box">
                    <span>🔒</span>
                    <input type="password"
                    placeholder="Password">
                    <span>◉</span>
                </div>

                <p class="forgot">Forgot Password?</p>

                <button class="signin">Sign in</button>
            </form>

            <div class="or">
                <span></span>
                or
                <span></span>
            </div>

            <button class="social">G Sign in with Google</button>
            <button class="social">f Sign in with Facebook</button>
            <button class="social"> Sign in with Apple</button>

            <p class="account">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </div>

        <!-- Image Section -->
        <div class="image">
            <img src="images (1).jpg">
        </div>

    </div>

</body>
</html>
